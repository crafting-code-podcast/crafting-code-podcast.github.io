<html>
    <head>
        <meta charset="UTF-8" />
        <title>Crafting Code Podcast</title>
        <link rel="stylesheet" href="../style.css" />
        <link rel="icon" href="/logo-90.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
        <link rel="apple-touch-icon" sizes="90x90" href="/logo-90.png">
        <meta property="og:title" content="Crafting Code Podcast - Search" />
        <meta property="og:description" content="Search every episode's transcript, summary, themes and references." />
        <meta property="og:image" content="https://crafting-code-podcast.github.io/logo-90.png" />
    </head>
    <body>
        <div class="content">
            <h1><a href="/index.html">Crafting Code Podcast</a></h1>
            <div class="terminal">
                <nav>
                    <span class="dir">~/podcast</span>
                    $ ls
                    <ul>
                        <li>about.txt</li>
                        <li>copyright.txt</li>
                        <li><a href="/episodes/index.html">episodes</a></li>
                        <li><a href="/themes/index.html">themes</a></li>
                        <li><a href="/references/index.html">references</a></li>
                        <li><a href="/search/index.html">search</a></li>
                        <li><a href="https://d1ohtljhghz8nz.cloudfront.net/feed.xml">rss&#8209;feed</a></li>
                    </ul>
                </nav>

                <span class="dir">~/podcast</span>
                <p>$ cd search</p>

                <span class="dir">~/podcast/search</span>
                <label for="q">$ grep -i</label>
                <input id="q" type="search" autocomplete="off" autofocus placeholder="a word or phrase" aria-describedby="status" />
                <p id="status" role="status">Loading the index&hellip;</p>
                <noscript><p>Search needs JavaScript. You can still browse the <a href="/episodes/index.html">episodes</a>, <a href="/themes/index.html">themes</a> and <a href="/references/index.html">references</a>.</p></noscript>
                <div id="results"></div>

                <span class="dir">~/podcast/search</span>
                $ cat ../copyright.txt
                <p>Copyright &copy; 2026 - Crafting Code Podcast</p>

                <script src="minisearch.min.js"></script>
                <script src="search.js"></script>
            </div>
        </div>
    </body>
</html>
